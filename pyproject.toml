[project]
name = "uitars-mcp"
version = "0.1.0"
description = "UI-TARS MCP â€” desktop GUI agent server with MCP tools and webapp"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "ui-tars>=0.1",
    "mss>=10.0",
    "pyautogui>=0.9",
    "pillow>=11.0",
]

[project.scripts]
uitars-mcp = "uitars_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16.0,<0.17"]
browser = ["playwright>=1.48"]

[dependency-groups]
dev = ["ruff>=0.16.0,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "S106", "S110", "S112", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
